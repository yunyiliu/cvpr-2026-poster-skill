<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVPR 2026 Editable Poster</title>
<style>
  :root {
    --poster-w: 2134mm;
    --poster-h: 1067mm;
    --page-bg: #e8edf3;
    --poster-bg: #f7fafc;
    --header-a: #154f93;
    --header-b: #2f7bc7;
    --header-c: #4ba9ea;
    --card-bg: #ffffff;
    --card-border: #d8e0ea;
    --text: #14304b;
    --muted: #47627c;
    --gap: 10mm;
    --pad: 16mm;
    --radius: 5mm;
    --font-scale: 1;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { background: var(--page-bg); }
  body {
    width: var(--poster-w);
    height: var(--poster-h);
    font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background: var(--poster-bg);
    overflow: hidden;
    transform-origin: top left;
    position: absolute;
    left: 0;
    top: 0;
  }

  @page { size: var(--poster-w) var(--poster-h); margin: 0; }
  @media print {
    html { background: #fff; }
    body {
      position: static;
      transform: none !important;
      width: var(--poster-w);
      height: var(--poster-h);
    }
    .toolbar, .col-divider, .row-divider, .card-handle, .drop-zone { display: none !important; }
  }

  body.preview .toolbar,
  body.preview .col-divider,
  body.preview .row-divider,
  body.preview .card-handle,
  body.preview .drop-zone { display: none !important; }

  #root {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr;
  }

  .toolbar {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 1000;
    display: flex;
    gap: 6px;
    padding: 6px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.92);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
  }
  .toolbar button {
    border: 0;
    padding: 7px 11px;
    border-radius: 8px;
    background: #1b5da2;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .toolbar button.secondary {
    background: #dfe8f1;
    color: #23405f;
  }

  .header {
    background: linear-gradient(135deg, var(--header-a), var(--header-b) 58%, var(--header-c));
    color: #fff;
    padding: 14mm var(--pad) 12mm;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 12mm;
  }
  .header-center {
    text-align: center;
    min-width: 0;
  }
  .title {
    font-size: calc(140pt * var(--font-scale));
    line-height: 1.04;
    font-weight: 850;
    margin: 0 0 8mm;
    letter-spacing: -0.01em;
  }
  .meta {
    font-size: calc(56pt * var(--font-scale));
    line-height: 1.28;
    opacity: 0.96;
    white-space: pre-line;
    margin-bottom: 3mm;
  }
  .badge {
    display: inline-block;
    margin-top: 6mm;
    padding: 4mm 10mm;
    border-radius: 999px;
    border: 1.6mm solid rgba(255, 255, 255, 0.45);
    font-size: calc(40pt * var(--font-scale));
    font-weight: 800;
    white-space: nowrap;
  }
  .logos-left,
  .logos-right {
    display: flex;
    align-items: center;
    gap: 6mm;
  }
  .logos-left { justify-content: flex-start; }
  .logos-right {
    justify-content: flex-end;
    gap: 8mm;
  }
  .logos-left .logo-pill {
    background: transparent;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logos-right .logo-pill {
    background: #ffffff;
    border-radius: 4mm;
    padding: 4mm 6mm;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2mm 6mm rgba(0, 0, 0, 0.18);
  }
  .logos-left img {
    max-height: 90mm;
    max-width: 200mm;
    object-fit: contain;
  }
  .logos-right img {
    max-height: 120mm;
    max-width: 300mm;
    object-fit: contain;
  }
  .qr-block {
    text-align: center;
    margin-left: 6mm;
  }
  .qr-block img {
    width: 90mm;
    height: 90mm;
    object-fit: cover;
    border-radius: 3mm;
    background: #fff;
    padding: 2mm;
  }
  .qr-label {
    margin-top: 3mm;
    font-size: calc(32pt * var(--font-scale));
    font-weight: 700;
    color: rgba(255, 255, 255, 0.95);
  }

  .poster-area {
    padding: var(--gap) var(--pad) var(--pad);
    display: flex;
    gap: var(--gap);
    min-height: 0;
  }
  .column {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    min-height: 0;
  }
  .column-body {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    min-height: 0;
    flex: 1;
  }

  .col-divider {
    width: 6mm;
    margin: 0 -3mm;
    cursor: col-resize;
    position: relative;
    z-index: 20;
  }
  .col-divider::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 1.5mm;
    width: 3mm;
    border-radius: 3mm;
    background: rgba(27, 93, 162, 0.16);
  }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--card-bg);
    border: 0.6mm solid var(--card-border);
    border-top: 2.4mm solid var(--card-accent, #1b5da2);
    border-radius: var(--radius);
    padding: 6mm 6.5mm 5.5mm;
    box-shadow: 0 4px 18px rgba(16, 36, 61, 0.08);
    overflow: hidden;
  }
  .card.flex-grow { flex: 1 1 0; }
  .card.fixed-height { flex: 0 0 auto; }
  .card h2 {
    margin: 0 0 6mm;
    font-size: calc(80pt * var(--font-scale));
    line-height: 1.05;
    font-weight: 850;
    color: var(--card-accent, #1b5da2);
  }
  .card-body {
    min-height: 0;
    font-size: calc(48pt * var(--font-scale));
    line-height: 1.3;
    color: var(--text);
  }
  .card-body p { margin: 0 0 6mm; }
  .card-body ul { margin: 0; padding-left: 14mm; }
  .card-body li { margin: 0 0 5mm; }
  .card-body img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
    margin: 0 auto;
  }
  .card-body table {
    width: 100%;
    border-collapse: collapse;
    font-size: calc(40pt * var(--font-scale));
  }
  .card-body th,
  .card-body td {
    border: 0.3mm solid #d6deea;
    padding: 1.5mm 2mm;
    text-align: left;
  }
  .card-body th {
    background: #edf3fb;
    color: #1c4f87;
    font-weight: 800;
  }

  .card-handle {
    position: absolute;
    right: 4mm;
    top: 4mm;
    width: 8mm;
    height: 8mm;
    border-radius: 2mm;
    background: rgba(27, 93, 162, 0.12);
    color: #1b5da2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 900;
    cursor: grab;
    user-select: none;
  }
  .card.swap-selected {
    outline: 1.2mm solid rgba(241, 131, 43, 0.85);
    outline-offset: -0.6mm;
  }
  .card.swap-selected .card-handle {
    background: rgba(241, 131, 43, 0.2);
    color: #cc6f18;
  }

  .row-divider {
    height: 6mm;
    margin: -3mm 0;
    cursor: row-resize;
    position: relative;
    z-index: 15;
  }
  .row-divider::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 1.5mm;
    height: 3mm;
    border-radius: 3mm;
    background: rgba(27, 93, 162, 0.14);
  }

  .drop-zone {
    height: 0;
    position: relative;
    z-index: 10;
  }
  .drop-zone.active {
    height: 7mm;
  }
  .drop-zone-inner {
    position: absolute;
    inset: 0;
    border-radius: 3mm;
    border: 0.6mm dashed rgba(241, 131, 43, 0.85);
    background: rgba(241, 131, 43, 0.12);
  }

  .fig {
    display: flex;
    flex-direction: column;
    gap: 2mm;
  }
  .fig-box {
    min-height: 120mm;
    border-radius: 3mm;
    background: #f3f7fb;
    border: 0.3mm solid #d8e0eb;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .fig-cap {
    font-size: calc(16pt * var(--font-scale));
    color: var(--muted);
  }
</style>
</head>
<body>
<div class="toolbar">
  <button id="preview-toggle" class="secondary">Preview</button>
  <button id="font-down" class="secondary">A-</button>
  <button id="font-up" class="secondary">A+</button>
  <button id="load-config" class="secondary">Load Config</button>
  <button id="save-config">Save</button>
  <button id="copy-config">Copy Config</button>
  <button id="reset-config" class="secondary">Reset</button>
</div>
<div id="root"></div>
<script>
const EMBEDDED_CONFIG = __POSTER_CONFIG__;
const LS_KEY = "cvpr-2026-poster-config";

const deepClone = (obj) => JSON.parse(JSON.stringify(obj));
function loadStoredConfig() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (error) {
    return null;
  }
}
let state = deepClone(loadStoredConfig() || EMBEDDED_CONFIG);
const defaultState = deepClone(EMBEDDED_CONFIG);
let dragCardId = null;
let swapCardId = null;

const mm = (value) => `${value}mm`;

function persistState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(state));
  } catch (error) {}
}

function contentWidthMm() {
  const gap = state.gapMm;
  const pad = state.paddingMm;
  return state.widthMm - pad * 2 - gap * (state.columns.length - 1);
}

function ensureColumnWidths() {
  const total = state.columns.reduce((sum, column) => sum + column.widthMm, 0);
  const target = contentWidthMm();
  if (!total || Math.abs(total - target) < 0.5) return;
  const scale = target / total;
  state.columns.forEach((column) => {
    column.widthMm = Math.max(140, Number((column.widthMm * scale).toFixed(1)));
  });
}

function normalizeLogos(logos) {
  return (logos || []).filter((logo) => logo && logo.src).map((logo) => ({
    src: logo.src,
    alt: logo.alt || "logo",
  }));
}

function applyPosterDimensions() {
  document.documentElement.style.setProperty("--poster-w", mm(state.widthMm));
  document.documentElement.style.setProperty("--poster-h", mm(state.heightMm));
  document.documentElement.style.setProperty("--gap", mm(state.gapMm));
  document.documentElement.style.setProperty("--pad", mm(state.paddingMm));
  document.documentElement.style.setProperty("--font-scale", state.fontScale);
}

function fitPosterToViewport() {
  const wPx = state.widthMm * 3.7795275591;
  const hPx = state.heightMm * 3.7795275591;
  const scale = Math.min(window.innerWidth / wPx, window.innerHeight / hPx);
  const x = Math.max(0, (window.innerWidth - wPx * scale) / 2);
  const y = Math.max(0, (window.innerHeight - hPx * scale) / 2);
  document.body.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
}

function renderHeader(root) {
  const header = document.createElement("div");
  header.className = "header";

  const leftLogos = document.createElement("div");
  leftLogos.className = "logos-left";
  (state.logos || []).forEach((logo) => {
    if (!logo || !logo.src) return;
    const pill = document.createElement("div");
    pill.className = "logo-pill";
    const img = document.createElement("img");
    img.src = logo.src;
    img.alt = logo.alt || "logo";
    pill.appendChild(img);
    leftLogos.appendChild(pill);
  });

  const supify = (s) => String(s || "")
    .replace(/\^\{([^}]+)\}/g, "<sup>$1</sup>")
    .replace(/\^(\d+)/g, "<sup>$1</sup>");
  const center = document.createElement("div");
  center.className = "header-center";
  center.innerHTML = `
    <div class="title">${state.title}</div>
    <div class="meta">${supify(state.authors)}</div>
    <div class="meta">${supify(state.affiliations)}</div>
    <div class="badge">${state.badge}</div>
  `;

  const right = document.createElement("div");
  right.className = "logos-right";
  (state.conferenceLogos || []).forEach((logo) => {
    if (!logo || !logo.src) return;
    const pill = document.createElement("div");
    pill.className = "logo-pill";
    const img = document.createElement("img");
    img.src = logo.src;
    img.alt = logo.alt || "CVPR 2026";
    pill.appendChild(img);
    right.appendChild(pill);
  });
  if (state.qr && state.qr.src) {
    const qr = document.createElement("div");
    qr.className = "qr-block";
    qr.innerHTML = `<img src="${state.qr.src}" alt="QR code"><div class="qr-label">${state.qr.label || "QR"}</div>`;
    right.appendChild(qr);
  }

  header.appendChild(leftLogos);
  header.appendChild(center);
  header.appendChild(right);
  root.appendChild(header);
}

function createCard(cardId) {
  const card = state.cards[cardId];
  const el = document.createElement("section");
  el.className = `card ${card.heightMm ? "fixed-height" : "flex-grow"}`;
  if (swapCardId === cardId) el.classList.add("swap-selected");
  el.dataset.cardId = cardId;
  el.style.setProperty("--card-accent", card.accent || "#1b5da2");
  if (card.heightMm) el.style.height = mm(card.heightMm);
  el.innerHTML = `
    <div class="card-handle" draggable="true" title="Drag to move">◆</div>
    <h2>${card.title}</h2>
    <div class="card-body">${card.html}</div>
  `;

  el.querySelector(".card-handle").addEventListener("dragstart", () => {
    dragCardId = cardId;
    swapCardId = null;
    document.querySelectorAll(".drop-zone").forEach((zone) => zone.classList.add("active"));
  });
  el.querySelector(".card-handle").addEventListener("dragend", () => {
    dragCardId = null;
    document.querySelectorAll(".drop-zone").forEach((zone) => zone.classList.remove("active"));
  });
  el.querySelector(".card-handle").addEventListener("click", (event) => {
    event.preventDefault();
    event.stopPropagation();
    if (swapCardId === cardId) {
      swapCardId = null;
      render();
      return;
    }
    if (swapCardId) {
      swapCards(swapCardId, cardId);
      swapCardId = null;
      return;
    }
    swapCardId = cardId;
    render();
  });
  return el;
}

function moveCard(cardId, targetColumnId, targetIndex) {
  if (!cardId) return;
  let removed = false;
  state.columns.forEach((column) => {
    const idx = column.cards.indexOf(cardId);
    if (idx >= 0) {
      column.cards.splice(idx, 1);
      removed = true;
    }
  });
  if (!removed) return;
  const targetColumn = state.columns.find((column) => column.id === targetColumnId);
  targetColumn.cards.splice(targetIndex, 0, cardId);
  render();
}

function swapCards(cardA, cardB) {
  if (cardA === cardB) return;
  let locA = null;
  let locB = null;
  state.columns.forEach((column) => {
    column.cards.forEach((id, index) => {
      if (id === cardA) locA = { column, index };
      if (id === cardB) locB = { column, index };
    });
  });
  if (!locA || !locB) return;
  locA.column.cards[locA.index] = cardB;
  locB.column.cards[locB.index] = cardA;
  render();
}

function addRowDivider(column, upperCardId) {
  const divider = document.createElement("div");
  divider.className = "row-divider";
  divider.addEventListener("mousedown", (event) => {
    event.preventDefault();
    const card = state.cards[upperCardId];
    const initialHeight = card.heightMm || 120;
    const startY = event.clientY;
    const onMove = (moveEvent) => {
      const deltaMm = (moveEvent.clientY - startY) / 3.7795275591;
      card.heightMm = Math.max(60, Number((initialHeight + deltaMm).toFixed(1)));
      render();
    };
    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  });
  column.appendChild(divider);
}

function addDropZone(columnBody, columnId, index) {
  const zone = document.createElement("div");
  zone.className = "drop-zone";
  zone.innerHTML = '<div class="drop-zone-inner"></div>';
  zone.addEventListener("dragover", (event) => event.preventDefault());
  zone.addEventListener("drop", (event) => {
    event.preventDefault();
    moveCard(dragCardId, columnId, index);
  });
  columnBody.appendChild(zone);
}

function renderColumns(root) {
  const poster = document.createElement("div");
  poster.className = "poster-area";

  state.columns.forEach((column, columnIndex) => {
    const columnEl = document.createElement("div");
    columnEl.className = "column";
    columnEl.style.width = mm(column.widthMm);
    columnEl.dataset.columnId = column.id;

    const body = document.createElement("div");
    body.className = "column-body";

    addDropZone(body, column.id, 0);
    column.cards.forEach((cardId, cardIndex) => {
      body.appendChild(createCard(cardId));
      addDropZone(body, column.id, cardIndex + 1);
      if (cardIndex < column.cards.length - 1) {
        addRowDivider(body, cardId);
      }
    });

    columnEl.appendChild(body);
    poster.appendChild(columnEl);

    if (columnIndex < state.columns.length - 1) {
      const divider = document.createElement("div");
      divider.className = "col-divider";
      divider.addEventListener("mousedown", (event) => {
        event.preventDefault();
        const left = state.columns[columnIndex];
        const right = state.columns[columnIndex + 1];
        const leftStart = left.widthMm;
        const rightStart = right.widthMm;
        const startX = event.clientX;
        const onMove = (moveEvent) => {
          const deltaMm = (moveEvent.clientX - startX) / 3.7795275591;
          left.widthMm = Math.max(160, Number((leftStart + deltaMm).toFixed(1)));
          right.widthMm = Math.max(160, Number((rightStart - deltaMm).toFixed(1)));
          render();
        };
        const onUp = () => {
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", onUp);
        };
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
      });
      poster.appendChild(divider);
    }
  });
  root.appendChild(poster);
}

function saveConfigFile() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "poster-config.json";
  link.click();
  URL.revokeObjectURL(url);
}

async function copyConfig() {
  await navigator.clipboard.writeText(JSON.stringify(state, null, 2));
}

function getWaste() {
  const details = [];
  let total = 0;
  document.querySelectorAll(".card").forEach((card) => {
    const cardId = card.dataset.cardId;
    const figBox = card.querySelector(".fig-box");
    const img = figBox ? figBox.querySelector("img") : null;
    let wasteH = 0;
    let wasteW = 0;
    if (figBox && img) {
      const boxRect = figBox.getBoundingClientRect();
      const imgRect = img.getBoundingClientRect();
      wasteH += Math.max(0, boxRect.height - imgRect.height);
      wasteW += Math.max(0, boxRect.width - imgRect.width);
    }
    const body = card.querySelector(".card-body");
    if (body) {
      const bodySlack = Math.max(0, body.clientHeight - body.scrollHeight);
      wasteH += bodySlack;
    }
    const pctBase = Math.max(1, card.getBoundingClientRect().height * card.getBoundingClientRect().width);
    const pct = ((wasteH * card.getBoundingClientRect().width + wasteW * card.getBoundingClientRect().height) / pctBase) * 100;
    total += wasteH + wasteW;
    details.push({
      card: cardId,
      wasteH: Number(wasteH.toFixed(2)),
      wasteW: Number(wasteW.toFixed(2)),
      pct: Number(pct.toFixed(2)),
    });
  });
  return { total: Number(total.toFixed(2)), details };
}

function render() {
  ensureColumnWidths();
  applyPosterDimensions();
  const root = document.getElementById("root");
  root.innerHTML = "";
  renderHeader(root);
  renderColumns(root);
  persistState();
  fitPosterToViewport();
}

window.posterAPI = {
  getConfig: () => deepClone(state),
  exportConfig: () => JSON.stringify(state, null, 2),
  importConfig: (config) => {
    const next = typeof config === "string" ? JSON.parse(config) : config;
    state = deepClone(next);
    render();
  },
  resetLayout: () => {
    state = deepClone(defaultState);
    localStorage.removeItem(LS_KEY);
    render();
  },
  setFontScale: (scale) => { state.fontScale = scale; render(); },
  getLayout: () => ({
    columns: deepClone(state.columns),
    cardHeights: Object.fromEntries(Object.entries(state.cards).map(([id, card]) => [id, card.heightMm || null])),
  }),
  getWaste,
  setHeader: (header) => {
    if (header.title !== undefined) state.title = header.title;
    if (header.authors !== undefined) state.authors = header.authors;
    if (header.affiliations !== undefined) state.affiliations = header.affiliations;
    if (header.badge !== undefined) state.badge = header.badge;
    render();
  },
  setTitle: (title) => { state.title = title; render(); },
  setAuthors: (authors) => { state.authors = authors; render(); },
  setAffiliations: (affiliations) => { state.affiliations = affiliations; render(); },
  setBadge: (badge) => { state.badge = badge; render(); },
  setQr: (src, label) => {
    state.qr = { src: src || "", label: label || "QR" };
    render();
  },
  setLogos: (logos) => {
    state.logos = normalizeLogos(logos);
    render();
  },
  setConferenceLogos: (logos) => {
    state.conferenceLogos = normalizeLogos(logos);
    render();
  },
  addLogo: (src, alt) => {
    state.logos = normalizeLogos([...(state.logos || []), { src, alt }]);
    render();
  },
  removeLogo: (src) => {
    state.logos = (state.logos || []).filter((logo) => logo.src !== src);
    render();
  },
  setColumnWidth: (columnId, widthMm) => {
    const column = state.columns.find((item) => item.id === columnId);
    if (!column) return;
    column.widthMm = widthMm;
    render();
  },
  setColumns: (columns) => {
    state.columns = deepClone(columns);
    render();
  },
  setColumnCards: (columnId, cards) => {
    const column = state.columns.find((item) => item.id === columnId);
    if (!column) return;
    column.cards = [...cards];
    render();
  },
  setCardHeight: (cardId, heightMm) => {
    if (!state.cards[cardId]) return;
    state.cards[cardId].heightMm = heightMm;
    render();
  },
  setCardTitle: (cardId, title) => {
    if (!state.cards[cardId]) return;
    state.cards[cardId].title = title;
    render();
  },
  setCardHtml: (cardId, html) => {
    if (!state.cards[cardId]) return;
    state.cards[cardId].html = html;
    render();
  },
  setCardAccent: (cardId, accent) => {
    if (!state.cards[cardId]) return;
    state.cards[cardId].accent = accent;
    render();
  },
  setCard: (cardId, patch) => {
    if (!state.cards[cardId]) return;
    state.cards[cardId] = { ...state.cards[cardId], ...patch };
    render();
  },
  moveCard,
  swapCards,
  saveToLocalStorage: persistState,
  clearLocalStorage: () => localStorage.removeItem(LS_KEY),
};

document.getElementById("preview-toggle").addEventListener("click", () => {
  document.body.classList.toggle("preview");
});
document.getElementById("font-down").addEventListener("click", () => {
  state.fontScale = Math.max(0.7, Number((state.fontScale - 0.05).toFixed(2)));
  render();
});
document.getElementById("font-up").addEventListener("click", () => {
  state.fontScale = Math.min(1.8, Number((state.fontScale + 0.05).toFixed(2)));
  render();
});
document.getElementById("load-config").addEventListener("click", () => {
  const raw = window.prompt("Paste poster-config JSON");
  if (!raw) return;
  try {
    window.posterAPI.importConfig(raw);
  } catch (error) {
    window.alert("Invalid JSON config.");
  }
});
document.getElementById("save-config").addEventListener("click", saveConfigFile);
document.getElementById("copy-config").addEventListener("click", copyConfig);
document.getElementById("reset-config").addEventListener("click", () => {
  window.posterAPI.resetLayout();
});

window.addEventListener("resize", fitPosterToViewport);
render();
</script>
</body>
</html>
